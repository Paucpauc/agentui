services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: agent-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persist the downloaded agent and its independent auth/config
      - agy-bin:/home/appuser/.local/bin
      - gemini-data:/home/appuser/.gemini
      - workspaces-data:/workspaces
    env_file:
      - .env
    environment:
      - WORKSPACE_BASE=/workspaces
      - AGENT_BIN=/home/appuser/.local/bin/agy
      - AGY_AUTO_UPDATE=${AGY_AUTO_UPDATE:-1}
      - AGENT_ARGS=--dangerously-skip-permissions
      - HOME=/home/appuser
      - TERM=xterm-256color
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - PUBLIC_LINK_SECRET=${PUBLIC_LINK_SECRET:-}

volumes:
  agy-bin:
  gemini-data:
  workspaces-data:


