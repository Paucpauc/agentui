<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Web UI — Login</title>
  <style>
    :root {
      --bg-darker: #181a1f;
      --bg-dark: #21252b;
      --bg-card: #21252b;
      --border-color: #3b4048;
      --text-main: #abb2bf;
      --text-bright: #e5c07b;
      --text-muted: #5c6370;
      --accent-color: #61afef;
      --accent-hover: #528bcc;
      --danger: #e06c75;
      --danger-bg: rgba(224, 108, 117, 0.15);
      --success: #98c379;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-darker);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .login-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
      font-size: 22px;
      color: #fff;
      margin-bottom: 6px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ui-icon {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      stroke: var(--accent-color);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .error-banner {
      display: none;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      background-color: var(--bg-darker);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(97, 175, 239, 0.2);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 20px;
    }

    .footer-note code {
      background-color: var(--bg-darker);
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 11px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <span class="logo"><svg class="ui-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></span>
        <span>Agent Web UI</span>
      </div>
      <div class="subtitle">Sign in to Control Panel</div>

      <div id="error-banner" class="error-banner"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">Sign In</button>
      </form>

      <div class="footer-note">
        Authentication is configured in <code>.env</code>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const btnSubmit = document.getElementById("btn-submit");
    const errorBanner = document.getElementById("error-banner");

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
    }

    function clearError() {
      errorBanner.textContent = "";
      errorBanner.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError("Please fill in all fields");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Signing in...";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          const next = params.get("next") || "/";
          // Security: avoid open redirect to external domains
          const target = (next.startsWith("/") && !next.startsWith("//")) ? next : "/";
          window.location.href = target;
        } else {
          showError(data.detail || "Invalid username or password");
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Sign In";
          passwordInput.value = "";
          passwordInput.focus();
        }
      } catch (err) {
        showError("Server connection error");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
